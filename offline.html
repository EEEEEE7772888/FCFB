<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FCFB</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d10; color: #e9edf2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .box { max-width: 320px; }
    .logo { width: 88px; height: 88px; border-radius: 22px; background: linear-gradient(#ffcb52, #f2a81d); margin: 0 auto 22px;
      display: grid; place-items: center; font-weight: 900; font-size: 26px; line-height: 1; color: #15171b; letter-spacing: 1px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #9aa3ae; font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
    button { background: #3d8bff; color: #fff; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">FC<br>FB</div>
    <h1>No internet connection</h1>
    <p>FCFB needs the internet to load your leagues. Check your Wi-Fi or cellular data, then try again.</p>
    <button onclick="location.href='https://eeeeee7772888.github.io/FCFB/'">Try again</button>
  </div>
</body>
</html>
