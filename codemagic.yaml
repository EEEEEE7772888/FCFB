# Codemagic builds the FCFB iPhone app on a Mac and sends it to App Store Connect.
# Start a build from codemagic.io (Start new build).
workflows:
  ios-testflight:
    name: FCFB iPhone app
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FCFB App Store Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.Amra.fcfb
      vars:
        BUNDLE_ID: com.Amra.fcfb
        APP_VERSION: "1.0"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Capacitor
        script: |
          cd ios-app
          npm install
      - name: Create the iOS project
        script: |
          cd ios-app
          rm -rf ios
          npx cap add ios
      - name: Add FCFB icon, sign-in, and settings
        script: |
          cd ios-app
          bash configure-ios.sh
      - name: Install iOS libraries
        script: |
          cd ios-app
          npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios-app/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build the app
        script: |
          xcode-project build-ipa --workspace ios-app/ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
